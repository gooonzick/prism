name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x86_64, os: ubuntu-24.04, musl: x86_64-unknown-linux-musl }
          - { name: Linux arm64, os: ubuntu-24.04-arm, musl: aarch64-unknown-linux-musl }
          - { name: macOS, os: macos-15 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # Before the GUI libraries are installed, so a stray rune dependency fails here.
      - run: cargo clippy --no-default-features --all-targets -- -D warnings
      - run: cargo test --no-default-features
      # The CLI archive releases ship for Linux: a static musl build (scripts/package-cli.sh).
      - name: Build the static Linux CLI
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          rustup target add ${{ matrix.musl }}
          cargo build --locked --no-default-features --target ${{ matrix.musl }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev libdbus-1-dev
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

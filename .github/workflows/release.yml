name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - { arch: x86_64, os: ubuntu-24.04 }
          - { arch: arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev libdbus-1-dev
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.tar.gz

  macos:
    name: macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/bundle-macos.sh
      - name: Zip the app
        run: |
          mkdir -p dist
          ditto -c -k --keepParent "target/release/Prism.app" "dist/prism-${GITHUB_REF_NAME#v}-macos-arm64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.zip

  release:
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Prism $GITHUB_REF_NAME" --generate-notes

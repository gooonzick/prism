[package]
name = "prism"
version = "0.1.0"
edition = "2024"
description = "Browse, install and sync agent skills across .agents, .claude, .codex, .opencode and more"
license = "MIT"
repository = "https://github.com/gooonzick/prism"

[features]
default = ["gui"]
# The window. Without it `prism` is the CLI only (for headless hosts).
gui = ["dep:rune", "dep:rune-kit", "dep:notify"]

[dependencies]
rune = { optional = true, git = "https://github.com/anomalyco/rune", rev = "7ead7d63fcf6f9dd9669385a8b90e2ae80015d7b", features = ["native-file-dialog"] }
rune-kit = { optional = true, git = "https://github.com/anomalyco/rune", rev = "7ead7d63fcf6f9dd9669385a8b90e2ae80015d7b", features = ["markdown"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
ureq = { version = "2", features = ["json"] }
dirs = "5"
notify = { optional = true, version = "8", default-features = false, features = ["macos_fsevent"] }
# Local time for the freedesktop trash's info files.
libc = "0.2"
# MCP configs, edited in place so comments, key order and formatting survive.
jsonc-parser = { version = "0.34", features = ["cst", "serde"] }
toml_edit = "0.25"

[dev-dependencies]
tempfile = "3"
# Renders assets/icon.svg for the app bundle (examples/render_icon.rs).
resvg = { version = "0.45", default-features = false }

[profile.dev.package."*"]
opt-level = 2

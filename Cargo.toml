[package]
name = "prism"
version = "0.1.0"
edition = "2024"
description = "Browse, install and sync agent skills across .agents, .claude, .codex, .opencode and more"
license = "MIT"

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "7ead7d63fcf6f9dd9669385a8b90e2ae80015d7b", features = ["native-file-dialog"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "7ead7d63fcf6f9dd9669385a8b90e2ae80015d7b", features = ["markdown"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
dirs = "5"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }

[dev-dependencies]
tempfile = "3"
# Renders assets/icon.svg for the app bundle (examples/render_icon.rs).
resvg = { version = "0.45", default-features = false }

[profile.dev.package."*"]
opt-level = 2
